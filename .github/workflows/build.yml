name: Build YammieCode

on:
  push:
    branches:
      - python-ide
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.1"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.yammie24 \
            --project-name yammiecode \
            .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yammiecode-apk
          path: build/app/outputs/flutter-apk/app-release.apk

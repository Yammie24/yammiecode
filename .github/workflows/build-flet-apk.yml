name: Build YammieCode Flet APK

on:
  push:
    branches:
      - flet-ide
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build Android APK
        run: |
          flet build apk src \
            --project "YammieCode" \
            --description "Free Python IDE for Android" \
            --product "YammieCode"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yammiecode-flet-apk
          path: build/apk/*.apk


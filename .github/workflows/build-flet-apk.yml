name: Build YammieCode Flet APK

on:
  push:
    branches:
      - flet-ide
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Build Android APK
        run: |
          flet build apk src \
            --project "YammieCode" \
            --description "Free Python IDE for Android" \
            --product "YammieCode"

      - name: Find APK
        run: |
          echo "Searching for APK files..."
    find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yammiecode-flet-apk
          path: "**/*.apk"
          if-no-file-found: error
